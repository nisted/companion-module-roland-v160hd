name: Build

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: corepack enable
      - run: yarn install --no-immutable
      - name: Dev kit (node_modules + lockfile) for offline work
        run: tar czf devkit.tgz node_modules yarn.lock
      - name: Publish dev kit to the devkit branch (only when asked)
        if: contains(github.event.head_commit.message, '[devkit]')
        run: |
          mkdir /tmp/dk && mv devkit.tgz /tmp/dk/ && cd /tmp/dk
          git init -q -b devkit && git add devkit.tgz
          git -c user.name=ci -c user.email=ci@localhost commit -qm devkit
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" devkit
      - run: yarn test
      - run: yarn package

      - uses: actions/upload-artifact@v4
        with:
          name: companion-module-roland-v160hd
          path: 'roland-v160hd-*.tgz'
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 'roland-v160hd-*.tgz'
